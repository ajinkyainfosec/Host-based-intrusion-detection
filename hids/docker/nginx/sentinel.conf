# /opt/hids/docker/nginx/sentinel.conf
# Sentinel HIDS — Nginx reverse proxy config

upstream sentinel_server {
    server server:8000;
    keepalive 32;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
     http2 on;        # ✅ disabled — agent reqwest does not support HTTP/2
    server_name _;

    # TLS
    ssl_certificate     /opt/hids/certs/sentinel.crt;
    ssl_certificate_key /opt/hids/certs/sentinel.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    # Security headers
    add_header X-Frame-Options           DENY;
    add_header X-Content-Type-Options    nosniff;
    add_header X-XSS-Protection          "1; mode=block";
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' cdnjs.cloudflare.com fonts.googleapis.com; style-src 'self' 'unsafe-inline' fonts.googleapis.com fonts.gstatic.com; font-src 'self' fonts.gstatic.com data:; connect-src 'self' wss: ws: https: cdnjs.cloudflare.com cdn.jsdelivr.net;";

    # ─── Dashboard ────────────────────────────────────────────────
    location / {
        root  /opt/hids/dashboard;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # ─── Agent event ingest ───────────────────────────────────────
    location /api/v1/events {
        proxy_pass         http://sentinel_server;
        proxy_http_version 1.1;
        proxy_set_header   Connection          "";
        proxy_set_header   Host                $host;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto   $scheme;
        client_max_body_size 10m;
        limit_req zone=agent_limit burst=500 nodelay;
    }

    # ─── General API proxy ────────────────────────────────────────
    location /api/ {
        proxy_pass         http://sentinel_server;
        proxy_http_version 1.1;
        proxy_set_header   Connection          "";
        proxy_set_header   Host                $host;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto   $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        limit_req zone=api_limit burst=200 nodelay;
    }

    # ─── WebSocket proxy ──────────────────────────────────────────
    location /ws/ {
        proxy_pass         http://sentinel_server;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade             $http_upgrade;
        proxy_set_header   Connection          "upgrade";
        proxy_set_header   Host                $host;
        proxy_set_header   X-Real-IP           $remote_addr;
        proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto   $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
