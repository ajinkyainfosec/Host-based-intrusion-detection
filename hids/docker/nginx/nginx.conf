# /opt/hids/docker/nginx/nginx.conf
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Real IP (strip Docker internal IPs, show actual client IP) ──
    set_real_ip_from  172.20.0.0/24;   # sentinel-net (all your containers)
    set_real_ip_from  172.17.0.0/16;   # docker0 default bridge
    set_real_ip_from  127.0.0.1;       # loopback healthchecks
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # ── Logging ─────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    # ── Performance ─────────────────────────────────────────────────
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # ── Gzip ────────────────────────────────────────────────────────
    gzip  on;
    gzip_types text/plain application/json application/javascript text/css;

    # ── Rate Limit Zones ────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m   rate=100r/s;
    limit_req_zone $binary_remote_addr zone=agent_limit:10m rate=500r/s;

    include /etc/nginx/conf.d/*.conf;
}
