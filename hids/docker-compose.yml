# docker-compose.yml
# Sentinel HIDS — Full Stack
# Services: server, postgres, redis, elasticsearch, nginx, prometheus

networks:
  sentinel-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  postgres_data:
  redis_data:
  elasticsearch_data:
  certs:

services:

  # ── Central Detection Server ──────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sentinel-server
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL:       postgresql+asyncpg://sentinel:${DB_PASSWORD}@postgres:5432/sentinel
      REDIS_URL:          redis://redis:6379/0
      ELASTICSEARCH_URL:  http://elasticsearch:9200
      API_KEY:            ${API_KEY}
      SECRET_KEY:         ${SECRET_KEY}
      LOG_LEVEL:          INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    networks:
      sentinel-net:
        ipv4_address: 172.20.0.10
    volumes:
      - ./server:/app
      - ./rules:/app/rules:ro
      - ./certs:/app/certs:ro
      - /var/log/sentinel:/var/log/sentinel
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── PostgreSQL ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: sentinel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       sentinel
      POSTGRES_USER:     sentinel
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      sentinel-net:
        ipv4_address: 172.20.0.20
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:5432:5432"   # local only

  # ── Redis (live state + caching) ──────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      sentinel-net:
        ipv4_address: 172.20.0.30
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "127.0.0.1:6379:6379"

  # ── Elasticsearch (log search + indexing) ────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
    container_name: sentinel-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type:            single-node
      xpack.security.enabled:    "false"
      ES_JAVA_OPTS:              "-Xms512m -Xmx512m"
      ELASTIC_PASSWORD:          ${ELASTIC_PASSWORD}
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      sentinel-net:
        ipv4_address: 172.20.0.40
    ports:
      - "127.0.0.1:9200:9200"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ── Nginx (reverse proxy + TLS termination) ───────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: sentinel-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /opt/hids/docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro          # ✅ absolute path
      - /opt/hids/docker/nginx/sentinel.conf:/etc/nginx/conf.d/sentinel.conf:ro  # ✅ absolute path
      - /opt/hids/certs:/opt/hids/certs:ro
      - /opt/hids/dashboard:/opt/hids/dashboard:ro
    depends_on:
      - server
    networks:
      sentinel-net:
        ipv4_address: 172.20.0.50

  # ── Prometheus (metrics) ──────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: sentinel-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      sentinel-net:
        ipv4_address: 172.20.0.60
    ports:
      - "127.0.0.1:9090:9090"
