# ── RULE 9: Base64 Encoded Execution ─────────────────────────
title: Defense Evasion — Base64 Encoded Execution
id: SENT-EVA-001
status: stable
description: |
  Detects execution of base64-encoded payloads.
severity: high
tags:
  - evasion
  - obfuscation
  - t1027
mitre:
  tactic: Defense Evasion
  technique_id: T1027
  technique_name: Obfuscated Files or Information
detection:
  cmdline_contains:
    - "base64 -d"
    - "base64 --decode"
    - "echo * | base64"
    - "|base64"
    - "eval $(echo"
    - "eval `echo"
---
