---
# ── RULE 4: Critical System File Modified ─────────────────────
title: Critical System File Modified
id: SENT-FIM-001
status: stable
description: |
  Detects modification of critical Linux system files.
severity: critical
tags:
  - fim
  - integrity
  - persistence
mitre:
  tactic: Defense Evasion
  technique_id: T1036
  technique_name: Masquerading
detection:
  file_path_contains:
    - "/etc/passwd"
    - "/etc/shadow"
    - "/etc/hosts"
    - "/etc/hostname"
    - "/etc/sudoers"
    - "/etc/sudoers.d/"
    - "/etc/ssh/sshd_config"
    - "/etc/ssh/ssh_config"
    - "/etc/pam.d/"
    - "/etc/ld.so.preload"
    - "/etc/ld.so.conf"
    - "/usr/bin/sudo"
    - "/usr/bin/su"
    - "/lib/x86_64-linux-gnu/libpam"
    - "/lib64/libpam"
    - "/boot/grub"
---
