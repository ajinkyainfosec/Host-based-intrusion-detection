# rules/sigma/linux_rules.yml
# Sentinel HIDS — Complete Detection Rules
# 17 rules (SENT-EVA-003 removed, SENT-PE-001 severity adjusted)
# ============================================================

# ── RULE 1: Reverse Shell ─────────────────────────────────────
title: Linux Reverse Shell Detection
id: SENT-RS-001
status: stable
description: |
  Detects common reverse shell patterns in process command lines.
severity: critical
tags:
  - reverse-shell
  - c2
  - execution
mitre:
  tactic: Command and Control
  technique_id: T1059
  technique_name: Command and Scripting Interpreter
detection:
  cmdline_contains:
    - "bash -i"
    - "sh -i"
    - "/dev/tcp/"
    - "/dev/udp/"
    - "0>&1"
    - "2>&1 1>&3"
    - "mkfifo /tmp/"
    - "python -c import socket"
    - "python3 -c import socket"
    - "perl -e use Socket"
    - "nc -e /bin/bash"
    - "ncat -e /bin/bash"
    - "exec /bin/bash"
    - "bash -c "bash -i" &"
---
# ── RULE 2: Privilege Escalation via Sudo ─────────────────────
title: Linux Privilege Escalation via Sudo
id: SENT-PE-001
status: stable
description: |
  Detects privilege escalation attempts using sudo to launch a root shell.
severity: medium
tags:
  - privesc
  - sudo
  - t1548
mitre:
  tactic: Privilege Escalation
  technique_id: T1548.003
  technique_name: Sudo and Sudo Caching
detection:
  auth_action:
    - sudo_command
  cmdline_contains:
    - "/bin/bash"
    - "sudo -i"
    - "sudo su"
    - "/bin/sh"
    - "passwd"
    - "visudo"
    - "su -"
    - "sudo /bin/bash -c "id""
---
